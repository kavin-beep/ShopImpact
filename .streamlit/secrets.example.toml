# EXAMPLE ONLY. Copy to secrets.toml for local configuration; never commit real secrets.
# For Streamlit Cloud use the app's private Secrets settings.
SHOPIMPACT_PUBLIC = true
SHOPIMPACT_DATABASE_URL = "postgresql+psycopg://USER:PASSWORD@HOST:5432/DATABASE?sslmode=require"

# Enable only after checking Gmail login and real delivery.
SHOPIMPACT_EMAIL_ENABLED = false
SHOPIMPACT_SMTP_HOST = "smtp.gmail.com"
SHOPIMPACT_SMTP_PORT = 465
SHOPIMPACT_SMTP_SECURITY = "ssl"
SHOPIMPACT_SMTP_USERNAME = "your-sender@gmail.com"
SHOPIMPACT_SMTP_FROM = "your-sender@gmail.com"
SHOPIMPACT_SMTP_PASSWORD = "YOUR_GOOGLE_APP_PASSWORD"
SHOPIMPACT_APP_URL = "http://127.0.0.1:8501"
